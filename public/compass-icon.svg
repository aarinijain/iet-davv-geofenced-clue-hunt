<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="radar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="50%" stop-color="#34A853" />
      <stop offset="100%" stop-color="#FBBC04" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <!-- Radar rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#334155" stroke-width="6" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#475569" stroke-width="8" />
  <circle cx="256" cy="256" r="60" fill="none" stroke="#4285F4" stroke-width="4" opacity="0.6" />
  <!-- Crosshairs -->
  <line x1="256" y1="56" x2="256" y2="456" stroke="#334155" stroke-width="3" />
  <line x1="56" y1="256" x2="456" y2="256" stroke="#334155" stroke-width="3" />
  <!-- Compass Needle -->
  <polygon points="256,90 286,256 256,236 226,256" fill="#EA4335" />
  <polygon points="256,422 286,256 256,276 226,256" fill="#E2E8F0" />
  <!-- Center Pin -->
  <circle cx="256" cy="256" r="22" fill="#0f172a" stroke="#FBBC04" stroke-width="8" />
  <circle cx="256" cy="256" r="8" fill="#34A853" />
</svg>
